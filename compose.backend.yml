services:
  minitor-backend:
    image: ghcr.io/ivanmissu/monitor-order-monitoring-prototype-backend-dev:java25
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      MAVEN_OPTS: "-XX:MaxRAMPercentage=75.0 -Dfile.encoding=UTF-8"
    restart: unless-stopped
