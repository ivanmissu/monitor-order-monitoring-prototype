# ─────────────────────────────────────────────────────────────────────────────
#  Monitor 前端 Nginx 配置（与 scripts/arena-run-frontend-nginx.sh 同构）
#
#  职责：① 托管 Vite 生产包并做 SPA history fallback；
#        ② 把 /api 与 /actuator 反向代理到后端 Service，
#           使浏览器只用相对路径，天然无跨域。
#
#  K8s 中本文件由 ConfigMap 挂载覆盖（见 deploy/k8s/40-frontend.yaml），
#  改配置后 rollout restart 前端 Deployment 即可生效。
# ─────────────────────────────────────────────────────────────────────────────

# 演示态角色 → 静态 token。部分网关（含某些 Ingress 配置）会剥离浏览器的
# Authorization 头，导致后端返回 40101。前端同时用 _monitor_role 查询参数声明角色，
# 这里在服务端侧补回 Bearer token；请求本身带了 Authorization 时不覆盖。
# ⚠️ 接入 SSO 后请删除下面两个 map 与 proxy_set_header Authorization 一行。
map $arg__monitor_role $monitor_role_auth {
    default "";
    dash    "Bearer dash-token";
    cs      "Bearer cs-token";
    oncall  "Bearer oncall-token";
    ingest  "Bearer ingest-token";
    admin   "Bearer admin-token";
}

map $http_authorization $monitor_auth {
    default $http_authorization;
    ""      $monitor_role_auth;
}

server {
    # 以非 root 运行时需 >1024 的端口
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # kubelet 探针用，不依赖静态文件是否存在
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $monitor_auth;
        proxy_set_header Connection        "";
        # SSE（/api/v1/stream/*）必须关闭缓冲并放长超时，否则事件流被攒住
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # 注意：写成字面量而非 nginx 变量。变量形式的 proxy_pass 会强制运行时
        # DNS 解析并要求显式 resolver，配置不当会直接 502。
        proxy_pass http://monitor-backend.monitor.svc.cluster.local:8080;
    }

    location /actuator/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_pass http://monitor-backend.monitor.svc.cluster.local:8080;
    }

    # 带内容哈希的产物可长期强缓存
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html 不缓存，保证发版后能立刻拿到新的 assets 引用
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
