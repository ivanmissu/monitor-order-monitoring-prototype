# ─────────────────────────────────────────────────────────────────────────────
#  后端运行期配置覆盖（application-k8s.yml）
#
#  以 Spring Boot 的「附加配置文件」方式挂载，通过 SPRING_CONFIG_ADDITIONAL_LOCATION
#  生效，只覆盖需要改的键，其余沿用 jar 内 application.yml 的默认值。
#
#  口令不写在这里 —— 走 Secret 注入的 CH_DASH_PWD / CH_CS_PWD 环境变量，
#  application.yml 里已是 ${CH_DASH_PWD:} 占位形式。
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: monitor-backend-config
  namespace: monitor
  labels:
    app.kubernetes.io/part-of: monitor
    app.kubernetes.io/component: backend
data:
  application-k8s.yml: |
    spring:
      kafka:
        bootstrap-servers: kafka-0.kafka.monitor.svc.cluster.local:9092
      data:
        redis:
          url: redis://redis.monitor.svc.cluster.local:6379

    management:
      endpoints:
        web:
          exposure:
            include: health,info,metrics,prometheus
      endpoint:
        health:
          probes:
            enabled: true
          # 便于排查依赖故障；/actuator 不经 Ingress 对外暴露
          show-details: always
          # 就绪探针只看「能否接流量」，不把 ClickHouse/Kafka 抖动放大成整体重启：
          # 依赖异常时由应用内的链路健康与告警体系反映，而不是让 Pod 被反复杀掉。
          group:
            readiness:
              include: readinessState

    monitor:
      store:
        kind: clickhouse
        agg:
          # 库名必须带上：ClickHouseStore 里大量使用不带库前缀的表名
          url: jdbc:ch://clickhouse.monitor.svc.cluster.local:8123/monitor
          username: grafana_dash
          password: ${CH_DASH_PWD:}
        ods:
          url: jdbc:ch://clickhouse.monitor.svc.cluster.local:8123/monitor
          username: cs_detail
          password: ${CH_CS_PWD:}

    logging:
      level:
        com.monitor.server: INFO
