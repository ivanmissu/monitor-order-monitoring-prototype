# ─────────────────────────────────────────────────────────────────────────────
#  示例密钥。请勿直接 apply 本文件到生产：先复制一份改掉所有口令，
#  或改用 kubectl create secret / SealedSecret / External Secrets。
#
#  口令对应关系（与 backend/src/main/resources/application.yml 一致）：
#    ch-admin-password  → ClickHouse default 账号（仅初始化 Job 与运维使用）
#    ch-dash-password   → grafana_dash，后端聚合读池（CH_DASH_PWD）
#    ch-cs-password     → cs_detail，后端明细读写池（CH_CS_PWD）
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: monitor-clickhouse-auth
  namespace: monitor
  labels:
    app.kubernetes.io/part-of: monitor
type: Opaque
stringData:
  ch-admin-password: "CHANGE_ME_admin"
  ch-dash-password: "CHANGE_ME_dash"
  ch-cs-password: "CHANGE_ME_cs"
