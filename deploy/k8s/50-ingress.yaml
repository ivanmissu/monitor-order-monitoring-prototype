# ─────────────────────────────────────────────────────────────────────────────
#  对外暴露（ingress-nginx）
#
#  只暴露前端 Service：/api 由前端 Pod 内的 Nginx 反代到后端，
#  后端 Service 不直接对外，/actuator 也就不会暴露到公网。
#
#  没有 Ingress Controller？用文件底部的 NodePort 方案（去掉注释即可）。
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monitor
  namespace: monitor
  labels:
    app.kubernetes.io/part-of: monitor
  annotations:
    # SSE（/api/v1/stream/*）必须关闭响应缓冲，否则事件流被攒住不下发
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # 事件上报批量上限 2MiB（monitor.ingest.max-batch-bytes），放宽 body 限制
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
    # 启用 TLS 后再打开强制跳转
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  # tls:
  #   - hosts:
  #       - monitor.example.com
  #     secretName: monitor-tls        # 需提前创建或由 cert-manager 签发
  rules:
    - host: monitor.example.com        # ← 改成你的域名
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: monitor-frontend
                port:
                  number: 80
---
# ── 没有 Ingress Controller 时的替代方案：NodePort ──────────────────────────
# 取消下面的注释并 apply，然后用 http://<任一节点IP>:30080 访问。
#
# apiVersion: v1
# kind: Service
# metadata:
#   name: monitor-frontend-nodeport
#   namespace: monitor
#   labels:
