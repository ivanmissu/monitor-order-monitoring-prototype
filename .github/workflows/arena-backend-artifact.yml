name: Arena backend artifact

# 在 GitHub Actions 上用 Temurin JDK 25 编译打包后端 demo jar，
# 并把可运行产物作为 artifact 上传。Arena 沙箱只安装 jdk4py（Java 25 JRE，
# 无 javac），因此编译打包放在 CI 完成，沙箱只负责下载产物并运行。

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0a484-monitor-order-monitoring-proto
    paths:
      - "backend/**"
      - ".github/workflows/arena-backend-artifact.yml"

permissions:
  contents: read

concurrency:
  group: arena-backend-artifact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build demo jar (JDK 25)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Show tool versions
        run: |
          java -version
          mvn -version

      - name: Build demo jar
        run: |
          mvn --batch-mode --no-transfer-progress \
            -Dspring-boot.run.profiles=demo \
            -f backend/pom.xml \
            clean package

      - name: Upload runnable jar
        uses: actions/upload-artifact@v4
        with:
          name: minitor-server-demo
          path: backend/target/minitor-server-1.4.0.jar
          if-no-files-found: error
          retention-days: 7
