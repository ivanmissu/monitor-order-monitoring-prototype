name: Arena backend artifact

# 在 GitHub Actions 上用 Temurin JDK 25 编译打包后端 jar（demo + integration 两份）。
#
# Arena 沙箱只安装 jdk4py（Java 25 JRE，无 javac），因此编译打包放在 CI 完成，
# 沙箱只负责取回产物并运行。
#
#   monitor-server-demo.jar         默认构建，运行时 --spring.profiles.active=demo
#   monitor-server-integration.jar  -P integration-bundle（生产中间件依赖 + 内嵌 KRaft
#                                   broker，spring-kafka-test runtime），运行时
#                                   --spring.profiles.active=integration
#
# 注意：普通 upload-artifact 的下载走 Azure blob（*.blob.core.windows.net），
# 该域名在 Arena 沙箱被防火墙拦截，无法下载。GitHub Releases 资源域名同样不可达。
# 沙箱内可达的只有 github.com / codeload.github.com（即 git 协议），
# 因此这里额外把 jar 提交并强制推送到专用产物分支 `arena-artifacts/backend-jar`，
# 沙箱通过 `git fetch` 取回。同时保留 upload-artifact 便于在 GitHub 网页端下载。

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'arena/**'
    paths:
      - "backend/**"
      - ".github/workflows/arena-backend-artifact.yml"

permissions:
  contents: write

concurrency:
  group: arena-backend-artifact-${{ github.ref }}
  cancel-in-progress: true

env:
  ARTIFACT_BRANCH: arena-artifacts/backend-jar
  JAR_PATH: backend/target/monitor-server-1.4.0.jar

jobs:
  build:
    name: Build demo + integration jars (JDK 25)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Show tool versions
        run: |
          java -version
          mvn -version

      - name: Build integration jar (real middleware + embedded KRaft)
        run: |
          mvn --batch-mode --no-transfer-progress \
            -P integration-bundle \
            -f backend/pom.xml \
            clean package

      - name: Stage integration jar
        run: |
          mkdir -p staging
          cp "$JAR_PATH" staging/monitor-server-integration.jar

      - name: Build demo jar (no-middleware fallback)
        run: |
          mvn --batch-mode --no-transfer-progress \
            -Dspring-boot.run.profiles=demo \
            -f backend/pom.xml \
            clean package

      - name: Stage demo jar
        run: |
          cp "$JAR_PATH" staging/monitor-server-demo.jar

      - name: Upload runnable jars (web download)
        uses: actions/upload-artifact@v4
        with:
          name: monitor-server-jars
          path: staging/
          if-no-files-found: error
          retention-days: 7

      - name: Publish jars to artifact branch (git-reachable)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          set -Eeuo pipefail

          WORK="$(mktemp -d)"
          cp staging/monitor-server-demo.jar "$WORK/"

          # integration jar 内嵌 Kafka 服务端（EmbeddedKafkaKraftBroker）体积 ~165MB，
          # 超过 git 推送单文件 100MB 上限，切成 <95MB 分片，沙箱端按序重组。
          split -b 95m -d --additional-suffix=.part \
            staging/monitor-server-integration.jar "$WORK/ig-part."
          sha256sum staging/monitor-server-integration.jar | awk '{print $1}' \
            > "$WORK/INTEGRATION_SHA256"

          # 记录来源提交，便于核对产物与源码是否一致。
          cat >"$WORK/BUILD_INFO.txt" <<EOF
          source_commit=${GITHUB_SHA}
          source_ref=${GITHUB_REF}
          run_id=${GITHUB_RUN_ID}
          built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          jars=monitor-server-demo.jar + monitor-server-integration.jar(ig-part.*.part 分片重组)
          java=25 (temurin, build); jdk4py 25.0.2.1 (sandbox, run)
          EOF

          cd "$WORK"
          git init -q
          git checkout -q -b "$ARTIFACT_BRANCH"
          git add BUILD_INFO.txt INTEGRATION_SHA256 monitor-server-demo.jar ig-part.*.part
          git commit -q -m "build: demo + integration jars from ${GITHUB_SHA}"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${ARTIFACT_BRANCH}"
          echo "Pushed jars to branch ${ARTIFACT_BRANCH}"
