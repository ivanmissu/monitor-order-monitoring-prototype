name: Backend verification

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'arena/**'
    paths:
      - "backend/**"
      - "sdk/**"
      - ".github/workflows/backend-verify.yml"

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    name: JDK 25 build and demo smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Show tool versions
        run: |
          java -version
          mvn -version

      - name: Build backend
        run: |
          mvn --batch-mode --no-transfer-progress \
            -Dspring-boot.run.profiles=demo \
            -f backend/pom.xml \
            clean package

      - name: Build SDK modules
        shell: bash
        run: |
          set -o pipefail
          # GitHub Actions 默认启用 -e；先关闭，才能在失败后将日志转为 Check 注释。
          set +e
          LOG="${RUNNER_TEMP}/sdk-build.log"
          mvn --batch-mode --no-transfer-progress \
            -f sdk/pom.xml \
            clean verify 2>&1 | tee "$LOG"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Arena 沙箱无法直连 Actions 原始日志；将末尾输出合并为 Check 注释，便于快速定位。
            details="$(grep -E '\[ERROR\]|BUILD FAILURE|Caused by:' "$LOG" | tail -n 30)"
            [ -n "$details" ] || details="$(tail -n 25 "$LOG")"
            details="${details//'%'/'%25'}"
            details="${details//$'\r'/'%0D'}"
            details="${details//$'\n'/'%0A'}"
            echo "::error title=SDK build::$details"
            exit "$status"
          fi

      - name: Start demo profile and verify APIs
        shell: bash
        run: |
          set -Eeuo pipefail

          JAR="backend/target/monitor-server-1.4.0.jar"
          LOG="${RUNNER_TEMP}/monitor-server.log"

          java -jar "$JAR" --spring.profiles.active=demo >"$LOG" 2>&1 &
          SERVER_PID=$!

          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:8080/actuator/health \
              -o "${RUNNER_TEMP}/health.json"; then
              ready=1
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Backend exited before becoming healthy"
              cat "$LOG"
              exit 1
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "Backend did not become healthy within 60 seconds"
            cat "$LOG"
            exit 1
          fi

          curl --fail --silent --show-error \
            -H "Authorization: Bearer dash-token" \
            http://127.0.0.1:8080/api/v1/sentinel/bootstrap \
            -o "${RUNNER_TEMP}/sentinel.json"

          curl --fail --silent --show-error \
            -H "Authorization: Bearer cs-token" \
            http://127.0.0.1:8080/api/v1/orders/CP20260903018462/workbench \
            -o "${RUNNER_TEMP}/order-workbench.json"

          curl --fail --silent --show-error \
            -H "Authorization: Bearer cs-token" \
            'http://127.0.0.1:8080/api/v1/orders/recent?limit=8' \
            -o "${RUNNER_TEMP}/recent-orders.json"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          tmp = Path(os.environ["RUNNER_TEMP"])
          health = json.loads((tmp / "health.json").read_text())
          sentinel = json.loads((tmp / "sentinel.json").read_text())
          order_workbench = json.loads((tmp / "order-workbench.json").read_text())
          recent_orders = json.loads((tmp / "recent-orders.json").read_text())

          assert health["status"] == "UP", health
          assert sentinel["code"] == 0, sentinel
          assert sentinel["data"]["link_health"]["nodes"], sentinel
          assert sentinel["data"]["alerts"], sentinel
          assert order_workbench["code"] == 0, order_workbench
          assert order_workbench["data"]["order"]["order_id"] == "CP20260903018462", order_workbench
          assert len(order_workbench["data"]["timeline"]["events"]) >= 1, order_workbench
          assert recent_orders["code"] == 0 and recent_orders["data"], recent_orders

          print("Health:", health["status"])
          print("Link nodes:", len(sentinel["data"]["link_health"]["nodes"]))
          print("Active alerts:", len(sentinel["data"]["alerts"]))
          print("Order events:", len(order_workbench["data"]["timeline"]["events"]))
          PY

          echo "--- Backend log tail ---"
          tail -n 80 "$LOG"
