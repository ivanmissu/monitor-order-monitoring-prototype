name: Backend development image

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'arena/**'
    paths:
      - "backend/**"
      - ".github/workflows/backend-dev-image.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-dev-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-backend-dev

jobs:
  build-publish-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish JDK 25 development image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:java25
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the published image
        shell: bash
        run: |
          set -Eeuo pipefail

          IMAGE="${REGISTRY}/${IMAGE_NAME}:sha-${GITHUB_SHA}"
          docker pull "$IMAGE"
          docker run --detach --rm \
            --name monitor-backend-image-test \
            --publish 127.0.0.1:8080:8080 \
            "$IMAGE"

          cleanup() {
            docker logs monitor-backend-image-test 2>/dev/null || true
            docker stop monitor-backend-image-test 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:8080/actuator/health \
              -o "${RUNNER_TEMP}/health.json"; then
              ready=1
              break
            fi
            if ! docker inspect monitor-backend-image-test >/dev/null 2>&1; then
              echo "Container exited before becoming healthy"
              exit 1
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "Container did not become healthy within 60 seconds"
            exit 1
          fi

          curl --fail --silent --show-error \
            -H "Authorization: Bearer dash-token" \
            http://127.0.0.1:8080/api/v1/sentinel/bootstrap \
            -o "${RUNNER_TEMP}/sentinel.json"

          curl --fail --silent --show-error \
            -H "Authorization: Bearer cs-token" \
            http://127.0.0.1:8080/api/v1/orders/CP20260903018462/workbench \
            -o "${RUNNER_TEMP}/order-workbench.json"

          curl --fail --silent --show-error \
            -H "Authorization: Bearer cs-token" \
            'http://127.0.0.1:8080/api/v1/orders/recent?limit=8' \
            -o "${RUNNER_TEMP}/recent-orders.json"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          tmp = Path(os.environ["RUNNER_TEMP"])
          health = json.loads((tmp / "health.json").read_text())
          sentinel = json.loads((tmp / "sentinel.json").read_text())
          workbench = json.loads((tmp / "order-workbench.json").read_text())
          recent_orders = json.loads((tmp / "recent-orders.json").read_text())

          assert health["status"] == "UP", health
          assert sentinel["code"] == 0, sentinel
          assert workbench["code"] == 0, workbench
          assert workbench["data"]["order"]["order_id"] == "CP20260903018462", workbench
          assert workbench["data"]["timeline"]["events"], workbench
          assert recent_orders["code"] == 0 and recent_orders["data"], recent_orders

          print("Image smoke test passed")
          print("Order events:", len(workbench["data"]["timeline"]["events"]))
          PY
